<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contatti">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<title>CONTATTI MOBILE</title>
<link rel="icon" href="icona.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{color-scheme:light;
  --accent:#2a78d6;--accent-h:#1f63b8;--cremisi:#D51544;--verde:#1baf7a;--rosso:#d03b3b;--ambra:#b8860b;--grigioL:#9a9a9a;
  --sfondo:#f4f4f1;--carta:#fcfcfb;--carta2:#efeeea;--carta3:#e4e3dd;--testo:#0b0b0b;--testo2:#3d3c3a;--tenue:#66655f;--bordo:#e1e0d9;--hover:rgba(11,11,11,.035);--giallo:#fff8dc;--rosso-chiaro:#f8dcdc;
  --capo:#ffffff;--ombra:0 1px 2px rgba(0,0,0,.06);--fs:16px;
  --sz-clas:#1F4E8C;--sz-rec:#1C6B4A;--sz-ref:#D9741A;--sz-dim:#6A4C93;--sz-prof:#4B5A6B;--sz-sit:#0E7C86;--sz-prom:#A77A14;--sz-file:#3C6E9F;--sz-cron:#2a78d6;--sz-prat:#E8912D;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html[data-theme="scuro"]{color-scheme:dark;
  --accent:#3987e5;--accent-h:#4f97ee;--sfondo:#0d0d0d;--carta:#1a1a19;--carta2:#232322;--carta3:#2b2b29;--testo:#fff;--testo2:#d6d5cc;--tenue:#a3a19a;--bordo:#2c2c2a;--hover:rgba(255,255,255,.035);--giallo:#2a2a1f;--rosso-chiaro:#4a1f22;
  --capo:#161615;--ombra:0 1px 2px rgba(0,0,0,.5);--verde:#199e70;--rosso:#e66767;--ambra:#d4b25a;
  --sz-clas:#7FB0F0;--sz-rec:#5CB88E;--sz-ref:#F0A050;--sz-dim:#B596E0;--sz-prof:#9AA8BA;--sz-sit:#5CC8D0;--sz-prom:#E0BE60;--sz-file:#86B4E6;--sz-cron:#9FC0F2;--sz-prat:#F0A050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--sfondo);color:var(--testo);font-size:var(--fs);line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header.top{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--capo);padding:calc(8px + var(--sat)) 14px 8px;box-shadow:0 1px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px}
.marchio{display:flex;align-items:center;gap:8px;min-width:0}
.marchio img{width:30px;height:30px;border-radius:8px}
.marchio b{font-size:12.5px;letter-spacing:.02em;white-space:nowrap;line-height:1.05}.marchio b .wd{display:block}
@media (max-width:430px){.marchio small{display:none}}.marchio b .wa{color:var(--accent)}.marchio b .wd{color:var(--cremisi)}
.marchio small{display:block;font-size:10px;color:var(--tenue);letter-spacing:.08em;margin-top:-2px}
.sp{flex:1}
#sy-spia{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--grigioL)}
#sy-spia svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
#sy-spia.sy-ok{color:var(--verde)}#sy-spia.sy-sync{color:var(--accent);animation:pulsa 1s ease-in-out infinite}#sy-spia.sy-errore{color:var(--rosso)}#sy-spia.sy-auth{color:var(--ambra);animation:pulsa 1s ease-in-out infinite}#sy-spia.sy-offline{color:var(--grigioL)}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.3}}
#tema{width:34px;height:34px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta);color:var(--testo);font-size:16px}
.hbt{width:36px;height:36px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta);color:var(--testo2);display:flex;align-items:center;justify-content:center}
.hbt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hbt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gruppi{display:flex;gap:4px}
.gruppi button{border:1.5px solid var(--bordo);background:var(--carta);color:var(--tenue);border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.gruppi button[data-g="st"].on{background:var(--cremisi);border-color:var(--cremisi);color:#fff}
.gruppi button[data-g="cl"].on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:360px){.marchio small{display:none}.gruppi button{padding:5px 7px;font-size:10px}}
main{padding:calc(60px + var(--sat)) 12px calc(74px + var(--sab));min-height:100%}
.vista{display:none}.vista.on{display:block}
nav.tab{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--capo);border-top:1px solid var(--bordo);display:flex;padding:4px 4px calc(4px + var(--sab))}
nav.tab button{flex:1;background:transparent;border:0;color:var(--tenue);font-size:10.5px;padding:5px 2px 3px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;letter-spacing:.02em}
nav.tab button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tab button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
nav.tab button .tn{position:absolute;margin-left:26px;margin-top:-4px;background:var(--cremisi);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
/* ricerca e filtri */
.cerca{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cerca input{flex:1;padding:11px 12px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -12px 6px;padding-left:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bordo);background:var(--carta);color:var(--testo2);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.st.on{background:var(--cremisi);border-color:var(--cremisi)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.conta{font-size:12px;color:var(--tenue);margin:0 2px 6px}
/* elenco */
.lista{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;overflow:hidden;box-shadow:var(--ombra)}
.riga{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bordo);cursor:pointer;min-height:58px}
.riga:last-child{border-bottom:0}.riga:active{background:var(--hover)}
.riga .tx{flex:1;min-width:0}
.riga .nm{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga .ds{font-size:12.5px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.riga .sopra{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.riga .sopra .tag-tipo{font-size:10px;padding:1px 7px}
.riga .dx{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gbar{display:inline-flex;gap:2px;flex:none;height:30px}.gbar i{display:block;width:4px;border-radius:2px;background:var(--carta3)}.gbar i.st.on{background:var(--cremisi)}.gbar i.cl.on{background:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--carta2);color:var(--testo);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill.es{background:#E8F3EC;color:#1C6B4A}.pill.no{background:#F6E7E7;color:#C00000}.pill.at{background:#FBF3DF;color:#8A6D1F}.pill.gr-st{background:var(--cremisi);color:#fff;font-weight:600}.pill.gr-cl{background:var(--accent);color:#fff;font-weight:600}
html[data-theme="scuro"] .pill.es{background:#1E3A2C;color:#7BD3A5}html[data-theme="scuro"] .pill.no{background:#4A1F22;color:#F09090}html[data-theme="scuro"] .pill.at{background:#3B3320;color:#E5C670}
.liv{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;color:#fff;font-size:11.5px;font-weight:800;text-align:center;vertical-align:middle}
.liv.A{background:#1C6B4A}.liv.B{background:var(--accent)}.liv.C{background:#8A6D1F}.liv.D{background:#9A9A9A}
.rq{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px 2px 3px;border-radius:999px;color:#fff;text-transform:uppercase}
.rq i{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:rgba(255,255,255,.3);font-style:normal;text-align:center;font-size:10px}
.rq.sospesa{background:#E8912D}.rq.accettata{background:#1C6B4A}.rq.rifiutata{background:#D51544}
.km{font-size:12px;color:var(--accent);font-weight:700}
.btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.peri{color:var(--rosso);border-color:var(--rosso)}.btn.mini{padding:8px 12px;font-size:13px;min-height:36px}
.btn:active{opacity:.75}
.vuoto{padding:22px 14px;color:var(--tenue);text-align:center;font-size:14px}
.altri{width:100%;padding:12px;background:var(--carta2);border:0;color:var(--accent);font-weight:600}
/* titoli di vista */
h1.tit{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);font-weight:800;margin:14px 2px 8px}
h1.tit:first-child{margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:10px 12px;box-shadow:var(--ombra);border-left:5px solid var(--c,var(--accent))}
.kpi .et{font-size:11.5px;color:var(--tenue);text-transform:uppercase;letter-spacing:.06em;font-weight:700}.kpi .nm{font-size:26px;font-weight:800;line-height:1.1}
/* scheda */
#scheda{position:fixed;inset:0;z-index:3000;background:var(--sfondo);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .22s ease;padding:0 12px calc(30px + var(--sab))}
#scheda.on{transform:none}
.sc-top{position:sticky;top:0;z-index:5;background:var(--capo);margin:0 -12px 12px;padding:calc(8px + var(--sat)) 10px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.sc-top .ind{width:38px;height:38px;border:0;background:transparent;color:var(--accent);font-size:22px;border-radius:10px}
.sc-top .tt{flex:1;min-width:0}.sc-top .tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:17px;overflow:hidden;line-height:1.15}.sc-top .tt span{font-size:12px;color:var(--tenue)}
.sz{border:1px solid var(--bordo);border-radius:14px;margin:0 0 12px;background:var(--carta);box-shadow:var(--ombra);overflow:hidden;border-left:6px solid var(--c)}
.sz>h3{margin:0;padding:9px 14px;border-bottom:1px solid var(--bordo);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--carta));display:flex;align-items:center;gap:6px}
.sz>h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c)}
.sz>h3 .pill{margin-left:auto;text-transform:none;letter-spacing:0}
.sz>.c{padding:12px 14px}
.sz-clas{--c:var(--sz-clas)}.sz-rec{--c:var(--sz-rec)}.sz-ref{--c:var(--sz-ref)}.sz-dim{--c:var(--sz-dim)}.sz-prof{--c:var(--sz-prof)}.sz-sit{--c:var(--sz-sit)}.sz-prom{--c:var(--sz-prom)}.sz-file{--c:var(--sz-file)}.sz-cron{--c:var(--sz-cron)}.sz-prat{--c:var(--sz-prat)}
dl.rg{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:14.5px}
dl.rg dt{color:var(--c);font-weight:600;opacity:.85;white-space:nowrap}dl.rg dd{margin:0;min-width:0;overflow-wrap:anywhere}
.az{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.az a,.az button{flex:1;min-width:30%;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--carta));color:var(--c);font-weight:700;border:1px solid color-mix(in srgb,var(--c) 30%,var(--bordo));font-size:14px}
.az svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ref{border:1px solid var(--bordo);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--sz-ref) 4%,var(--carta))}
.ref b{display:block;font-size:15px}.ref .ru{font-size:12.5px;color:var(--tenue)}.ref .az{margin-top:8px}
.form{display:grid;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tenue);font-weight:600}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--bordo);border-radius:10px;background:var(--carta);color:var(--testo);font-size:16px;width:100%}
.form textarea{min-height:68px;resize:vertical}
.form .due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sz-prom textarea{background:var(--giallo)}
.ev{padding:9px 0;border-bottom:1px solid var(--bordo)}.ev:last-child{border-bottom:0}
.ev .d{font-size:12px;color:var(--tenue);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .t{font-weight:650;margin-top:2px}.ev .n{font-size:14px;color:var(--testo2);white-space:pre-wrap;margin-top:2px}
.ev .h{font-size:14px;color:var(--testo2);margin-top:2px;overflow-wrap:anywhere}.ev .h img,.ev .h table{max-width:100%}.ev .h table{display:block;overflow-x:auto}.ev .h p{margin:4px 0}.ev .h ul{padding-left:18px;margin:4px 0}
.dir{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--carta2)}.dir.out{color:var(--accent)}.dir.in{color:var(--verde)}
.stati{display:flex;gap:6px;margin-top:10px}.stati button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--bordo);background:var(--carta);font-weight:700;font-size:13px;color:var(--testo2)}
.stati button.on.sospesa{background:#E8912D;color:#fff;border-color:#E8912D}.stati button.on.accettata{background:#1C6B4A;color:#fff;border-color:#1C6B4A}.stati button.on.rifiutata{background:#D51544;color:#fff;border-color:#D51544}
.tag-tipo{display:inline-block;color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;padding:2px 9px;border-radius:999px;text-transform:uppercase}
.testo{font-size:14.5px;color:var(--testo2);white-space:pre-wrap;margin:0}
.nota{background:var(--carta2);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--testo2)}
body.sc-aperta,body.mappa-on{overflow:hidden}
summary::-webkit-details-marker{display:none}
#mappa.chiusa{display:none}
.foglio{position:fixed;inset:0;z-index:3500;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.foglio .fg{background:var(--carta);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:14px 14px calc(16px + var(--sab))}
.foglio h4{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.foglio button.v{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:16px;font-weight:600;margin-bottom:8px}
.foglio label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--testo2);margin:4px 2px 12px;min-height:36px}.foglio input[type=checkbox]{width:22px;height:22px}
/* vista Mappa a tutto schermo */
#v-mappa.on{position:fixed;left:0;right:0;top:calc(52px + var(--sat));bottom:calc(62px + var(--sab));padding:0;z-index:5}
#mappa2{position:absolute;inset:0;background:var(--carta2)}
.mp-top{position:absolute;top:8px;left:8px;right:8px;z-index:1200;display:flex;gap:6px}
.mp-top input{flex:1;padding:9px 12px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:16px;box-shadow:var(--ombra)}
.mp-top .hbt{width:40px;height:40px;flex:none;box-shadow:var(--ombra)}
.mp-pannello{position:absolute;top:56px;left:8px;right:8px;z-index:1200;background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-height:60%;overflow:auto}
.mp-pannello .form{gap:6px}.mp-pannello .due{grid-template-columns:1fr 1fr}
.mp-ctrl{position:absolute;right:8px;bottom:14px;z-index:1200;display:flex;flex-direction:column;gap:6px}
.mp-ctrl .hbt{width:42px;height:42px;box-shadow:var(--ombra);font-size:17px;font-weight:700}
.mp-conta{position:absolute;left:8px;bottom:14px;z-index:1200;background:var(--carta);border:1px solid var(--bordo);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--testo2);box-shadow:var(--ombra);max-width:65%}
.mp-legenda{position:absolute;left:8px;bottom:48px;z-index:1200;background:var(--carta);border:1px solid var(--bordo);border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:var(--ombra);max-width:70%}
.mp-legenda div{display:flex;align-items:center;gap:7px;margin:3px 0}.mp-legenda i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid #0F1620;flex:none}
.mp-legenda b.bd{display:inline-flex;width:16px;height:16px;border-radius:50%;color:#fff;font-size:9px;align-items:center;justify-content:center;border:2px solid #E8912D;flex:none}
.lp-wrap{background:none;border:0}
.lpin{position:absolute;left:0;top:0;width:calc(var(--b,1) * 17px);height:calc(var(--b,1) * 22px);transform:translate(calc(-50% + var(--ox,0) * 1px),calc(-94.44% + var(--oy,0) * 1px))}
.lpin svg{width:100%;height:100%;display:block;overflow:visible}
.lpin .ombra{fill:rgba(0,0,0,.28)}.lpin .corpo{stroke:#0F1620;stroke-width:1.2;stroke-linejoin:round}.lpin .occhio{fill:#0F1620}
.lpin.prov .corpo{stroke-dasharray:2.2 1.4;fill-opacity:.8}.lpin.prov .occhio{fill:none;stroke:#0F1620;stroke-width:1.2}
.rq-lampo-pin{animation:rq-lampeggia .9s steps(1,end) infinite}@keyframes rq-lampeggia{0%,49%{opacity:1}50%,100%{opacity:.25}}
.lpin .rq-badge{transform-origin:5.2px -15.2px}
.qui-punto{width:16px;height:16px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 0 8px rgba(26,115,232,.18);transform:translate(-50%,-50%);position:absolute;left:0;top:0}
.pop{min-width:200px}.pop b{display:block;font-size:15px;margin-bottom:2px}.pop .ds{font-size:12px;color:var(--tenue)}.pop .az{margin-top:8px}.pop .az a,.pop .az button{--c:var(--accent);min-width:28%;padding:8px 6px;font-size:13px}
.leaflet-popup-content{margin:10px 12px;font:inherit}.leaflet-popup-content-wrapper{border-radius:12px;background:var(--carta);color:var(--testo)}.leaflet-popup-tip{background:var(--carta)}

.leaflet-container{font:inherit}
.pin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pin.me{background:var(--accent);width:16px;height:16px;box-shadow:0 0 0 4px rgba(42,120,214,.3)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:4000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:.95}
.opz{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--ombra)}
.opz h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);margin:0 0 8px}
.opz .riga-o{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bordo);font-size:14.5px}.opz .riga-o:last-child{border-bottom:0}.opz .riga-o .sp{flex:1}
.log{font-size:11.5px;background:var(--carta2);border-radius:8px;padding:8px;white-space:pre-wrap;max-height:150px;overflow:auto;color:var(--testo2)}
.seg{display:inline-flex;border:1px solid var(--bordo);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--carta);padding:10px 12px;font-size:14px;color:var(--testo2);min-height:38px}.seg button.on{background:var(--accent);color:#fff}
.benvenuto{text-align:center;padding:40px 16px;color:var(--tenue)}.benvenuto b{display:block;color:var(--testo);font-size:18px;margin-bottom:8px}

<script>
/* SyncMotore — motore di sincronizzazione condiviso fra GESTIONE CONTATTI e CONTATTI MOBILE.
   Derivato dal motore di CLIENTOUR (v1.4.0): archivio locale sempre padrone, in sottofondo si scambiano
   con il cloud solo i record cambiati («delta»); una fotografia completa («base») alla prima volta e alle compattazioni.
   Fra più dispositivi vince la modifica più recente (per record). Nessuna dipendenza esterna.

       soloLettura: ['contatti'],       // raccolte che questo dispositivo riceve ma non invia mai
       locali: function () {...},       // -> { raccolta: { id: record } } (record SENZA _m: il motore li data da sé)
       applica: function (mod, del) {}, // applica i record remoti già filtrati: mod = {raccolta:[record]}, del = {raccolta:[{id,_m}]}; -> n applicati
       dopo: function (info) {},        // chiamata a fine ciclo: {applicati, inviati}
       stato: function (s, msg) {},     // off | ok | sync | errore | offline | auth
       salvaLocale: function () {}      // persiste l'archivio dopo i record ricevuti

    /* ---- compressione gzip (se il browser la offre) ---- */
    function comprimi(testo) {

    function nomeInfo(n) { var m = String(n).match(RX); return m ? { tipo: m[1], ts: +m[2], dev: m[3], gz: !!m[4] } : null; }

    /* ---- backend Google Drive (spazio riservato all'app: appDataFolder) ---- */

      nome: 'Google Drive',
      token: function (interattivo) {

}
function pulisciHtml(h) { return String(h || '').replace(/<\s*(script|style|iframe|object|embed|link|meta)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi, '').replace(/<\s*(script|style|iframe|object|embed|link|meta)[^>]*\/?>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '').replace(/href\s*=\s*"javascript:[^"]*"/gi, ''); }
function chiudiScheda() { $('#scheda').classList.remove('on'); schedaId = null; document.body.classList.remove('sc-aperta'); mostraVista(vista, true); }
window.addEventListener('popstate', function () { if (schedaId) chiudiScheda(); });
/* NAVIGAZIONE: app scelta una volta sola (Altro → Aspetto la cambia) */
var NAVIGATORI = [
  { id: 'apple', nome: 'Apple Mappe', url: function (c) { return 'https://maps.apple.com/?' + (c.lat && c.lng ? 'daddr=' + c.lat + ',' + c.lng : 'daddr=' + encodeURIComponent(c.sede)) + '&q=' + encodeURIComponent(c.nome); } },
  { id: 'google', nome: 'Google Maps', url: function (c) { return 'https://www.google.com/maps/dir/?api=1&destination=' + (c.lat && c.lng ? c.lat + ',' + c.lng : encodeURIComponent(c.sede)) + '&travelmode=driving'; } },
  { id: 'waze', nome: 'Waze', url: function (c) { return c.lat && c.lng ? 'https://waze.com/ul?ll=' + c.lat + ',' + c.lng + '&navigate=yes' : 'https://waze.com/ul?q=' + encodeURIComponent(c.sede) + '&navigate=yes'; } }
];
function navigatore() { try { return localStorage.getItem('cm.nav') || ''; } catch (e) { return ''; } }
function apriNavigatore(idN, c) { var n = NAVIGATORI.filter(function (x) { return x.id === idN; })[0] || NAVIGATORI[0]; var a = document.createElement('a'); a.href = n.url(c); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
function naviga(c) {
  var scelto = navigatore();
  if (scelto) { apriNavigatore(scelto, c); return; }
  var f = el('div', 'foglio'); f.innerHTML = '<div class="fg"><h4>Con quale app vuoi navigare?</h4>' + NAVIGATORI.map(function (n) { return '<button class="v" data-n="' + n.id + '">' + n.nome + '</button>'; }).join('') + '<label><input type="checkbox" id="nav-ric" checked> Ricorda la scelta (si cambia in Altro → Aspetto)</label><button class="btn" id="nav-ann" style="width:100%">Annulla</button></div>';
  document.body.appendChild(f);
  f.addEventListener('click', function (ev) { if (ev.target === f) f.remove(); });
  $('#nav-ann', f).addEventListener('click', function () { f.remove(); });
  $$('button.v', f).forEach(function (b) { b.addEventListener('click', function () { if ($('#nav-ric', f).checked) { try { localStorage.setItem('cm.nav', b.dataset.n); } catch (e) {} } f.remove(); apriNavigatore(b.dataset.n, c); }); });
}
function salvaSituazione(id, o) {
  var k = Object.assign({}, DB.situazioni[id] || { id: id }), prima = k.esito || '';
  ['esito', 'richiamo', 'referente', 'passo'].forEach(function (f) { if (o[f]) k[f] = o[f]; else delete k[f]; });
  k.id = id; k._m = Date.now(); DB.situazioni[id] = k;
  if ((o.esito || '') !== prima) { var vid = uid('v_'); DB.eventi[vid] = { id: vid, cid: id, d: oggi(), o: ora(), c: k.canale || '', e: o.esito || '', n: '', a: 1, _m: Date.now() }; k.data = oggi(); }
  salva(); toast('Situazione salvata'); apriScheda(id);
}
function registraEvento(id) {
  var d = $('#ev-d').value || oggi(), o = $('#ev-o').value || ora(), c = $('#ev-c').value, e = $('#ev-e').value, t = $('#ev-t').value.trim(), n = $('#ev-n').value.trim(), r = $('#ev-r').value;
  if (!t && !n && !e) { toast('Scrivi almeno un titolo, una nota o un esito'); return; }
  var vid = uid('v_'); DB.eventi[vid] = { id: vid, cid: id, d: d, o: o, c: c, e: e || (DB.situazioni[id] || {}).esito || '', t: t, n: n, _m: Date.now() };
  var k = Object.assign({ id: id }, DB.situazioni[id] || {}); k.data = d; k.canale = c; if (e) k.esito = e; if (r) k.richiamo = r; k._m = Date.now(); DB.situazioni[id] = k;
  salva(); toast('Evento registrato'); apriScheda(id);
}

/* ALTRO: sincronizzazione e opzioni */
var SY = null;
function nomeStato(s) { return { off: 'non attiva', ok: 'sincronizzato', sync: 'in corso…', errore: 'errore', offline: 'offline', auth: 'autorizzazione necessaria' }[s] || s; }
function disegnaAltro() {
  var box = $('#v-altro'), m = SY ? SY.meta : {}, fs = +(localStorage.getItem('cm.fs') || 16);
  var h = ['<div class="opz"><h2>Sincronizzazione con GESTIONE CONTATTI</h2>'];
  h.push('<div class="riga-o"><span>Servizio</span><span class="sp"></span><select id="sy-tipo" class="chip"><option value=""' + (!m.tipo ? ' selected' : '') + '>Nessuno</option><option value="drive"' + (m.tipo === 'drive' ? ' selected' : '') + '>Google Drive</option><option value="server"' + (m.tipo === 'server' ? ' selected' : '') + '>Server personale</option></select></div>');
  h.push('<div class="riga-o" id="sy-url-r" style="display:' + (m.tipo === 'server' ? '' : 'none') + '"><input id="sy-url" type="url" class="chip" style="flex:1" value="' + esc(m.serverUrl || '') + '" placeholder="https://server:8787"></div>');
  h.push('<div class="riga-o"><span>Stato</span><span class="sp"></span><b>' + nomeStato(SY ? SY.stato : 'off') + '</b></div>');
  if (SY && SY.messaggio) h.push('<div class="riga-o" style="color:var(--rosso);font-size:13px">' + esc(SY.messaggio) + '</div>');
  h.push('<div class="riga-o"><span>Ultimo allineamento</span><span class="sp"></span>' + (m.ultimoSync ? new Date(m.ultimoSync).toLocaleString('it-IT') : '—') + '</div>');
  h.push('<div class="riga-o"><span>Contatti · eventi · pratiche</span><span class="sp"></span>' + num(conta()) + ' · ' + num(Object.keys(DB.eventi).length) + ' · ' + num(Object.keys(DB.pratiche).length) + '</div>');
  h.push('<div class="riga-o"><span>Questo dispositivo</span><span class="sp"></span>' + esc(m.dispositivo || '') + '</div>');
  if (!SY || !SY.httpsOk()) h.push('<div class="nota" style="margin:6px 0">Google Drive funziona solo da un indirizzo https (l\'app pubblicata), non da un file locale.</div>');
  h.push('<div class="az" style="margin-top:8px"><button class="btn pri" id="sy-connetti">Connetti a Google</button><button class="btn" id="sy-ora">Sincronizza ora</button><button class="btn peri" id="sy-scollega">Scollega</button></div>');
  if (SY && SY.log.length) h.push('<div class="log" style="margin-top:8px">' + esc(SY.log.slice(0, 6).join('\n')) + '</div>');
  h.push('</div>');
  h.push('<div class="opz"><h2>Aspetto</h2><div class="riga-o"><span>Tema</span><span class="sp"></span><div class="seg"><button data-t="chiaro"' + (tema() === 'chiaro' ? ' class="on"' : '') + '>Chiaro</button><button data-t="scuro"' + (tema() === 'scuro' ? ' class="on"' : '') + '>Scuro</button><button data-t="auto"' + (tema() === 'auto' ? ' class="on"' : '') + '>Automatico</button></div></div>');
  h.push('<div class="riga-o"><span>App per navigare</span><span class="sp"></span><select id="op-nav" class="chip"><option value=""' + (navigatore() === '' ? ' selected' : '') + '>Chiedi al primo uso</option>' + NAVIGATORI.map(function (n) { return '<option value="' + n.id + '"' + (navigatore() === n.id ? ' selected' : '') + '>' + n.nome + '</option>'; }).join('') + '</select></div>');
  h.push('<div class="riga-o"><span>Dimensione testo</span><span class="sp"></span><div class="seg">' + [14, 16, 18].map(function (f) { return '<button data-fs="' + f + '"' + (fs === f ? ' class="on"' : '') + '>' + (f === 14 ? 'Piccolo' : f === 16 ? 'Normale' : 'Grande') + '</button>'; }).join('') + '</div></div></div>');
  h.push('<div class="opz"><h2>Dati</h2><div class="riga-o"><span>I contatti si modificano su GESTIONE CONTATTI (Mac). Dal telefono registri eventi, esiti, richiami, prossimi passi e stati delle pratiche: tornano al Mac alla prima sincronizzazione.</span></div><div class="az"><button class="btn peri" id="dt-azzera">Cancella i dati su questo telefono</button></div></div>');
  h.push('<div class="opz"><h2>Informazioni</h2><div class="riga-o"><span>CONTATTI MOBILE</span><span class="sp"></span>v' + APP_VER + '</div><div class="riga-o"><span>Dati da GESTIONE CONTATTI</span><span class="sp"></span>v' + esc(cfg().app || '—') + '</div></div>');
  box.innerHTML = h.join('');
  $('#sy-tipo').addEventListener('change', function () { $('#sy-url-r').style.display = this.value === 'server' ? '' : 'none'; if (SY) SY.imposta({ tipo: this.value || null, serverUrl: $('#sy-url').value.trim() }).then(function () { SY.avvia(); disegnaAltro(); }); });
  $('#sy-url').addEventListener('change', function () { if (SY && this.value.trim()) SY.imposta({ serverUrl: this.value.trim(), tipo: 'server' }).then(function () { SY.avvia(); disegnaAltro(); }); });
  $('#sy-connetti').addEventListener('click', function () { if (!SY) return; SY.connettiDrive(GC_CLIENT_ID).then(function () { toast('Google connesso'); return SY.avvia(); }).then(disegnaAltro, function (e) { toast('Google: ' + (e.message || e), 4000); disegnaAltro(); }); });
  $('#sy-ora').addEventListener('click', function () { if (!SY) return; SY.sincronizza({ interattivo: true }).then(disegnaAltro); });
  $('#sy-scollega').addEventListener('click', function () { if (!SY || !confirm('Scollegare la sincronizzazione? I dati sul telefono restano.')) return; SY.scollega().then(disegnaAltro); });
  $('#op-nav').addEventListener('change', function () { try { if (this.value) localStorage.setItem('cm.nav', this.value); else localStorage.removeItem('cm.nav'); } catch (e) {} toast('App di navigazione: ' + (this.options[this.selectedIndex].text)); });
  $$('.seg [data-t]', box).forEach(function (b) { b.addEventListener('click', function () { setTema(b.dataset.t); disegnaAltro(); }); });
  $$('.seg [data-fs]', box).forEach(function (b) { b.addEventListener('click', function () { localStorage.setItem('cm.fs', b.dataset.fs); applicaFs(); disegnaAltro(); }); });
  $('#dt-azzera').addEventListener('click', function () { if (!confirm('Cancellare tutti i dati su questo telefono? Alla prossima sincronizzazione vengono riscaricati dal cloud.')) return; DB = { contatti: {}, situazioni: {}, eventi: {}, pratiche: {}, nuoviContatti: {}, config: {} }; IDB.scrivi('db', JSON.stringify(DB)); if (SY) SY.azzeraMemoria().then(function () { SY.pianifica(500); }); disegnaAltro(); toast('Dati cancellati'); });
}
function tema() { return localStorage.getItem('cm.tema') || 'auto'; }
function setTema(t) { localStorage.setItem('cm.tema', t); applicaTema(); }
function applicaTema() { var t = tema(); if (t === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro'; document.documentElement.setAttribute('data-theme', t); $('#tema').innerHTML = t === 'scuro' ? '&#9728;' : '&#9790;'; }
function applicaFs() { document.documentElement.style.setProperty('--fs', (localStorage.getItem('cm.fs') || 16) + 'px'); }
$('#tema').addEventListener('click', function () { setTema(document.documentElement.getAttribute('data-theme') === 'scuro' ? 'chiaro' : 'scuro'); });
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applicaTema);
$('#sy-spia').addEventListener('click', function () { if (SY && SY.stato === 'auth') SY.sincronizza({ interattivo: true }); else mostraVista('altro'); });
function spia(s, msg) { var sp = $('#sy-spia'); sp.className = 'sy-' + s; sp.title = nomeStato(s) + (msg ? ' — ' + msg : ''); if (vista === 'altro') disegnaAltro(); }

/* ---------- sincronizzazione: applica i record ricevuti ---------- */
function applicaRemoti(mod, del) {
  var n = 0;
  ['contatti', 'situazioni', 'eventi', 'pratiche', 'config'].forEach(function (c) {
    (mod[c] || []).forEach(function (r) { var cp = {}; for (var k in r) if (k !== '_m') cp[k] = r[k]; DB[c][r.id] = cp; n++; if (c === 'contatti' && DB.nuoviContatti[r.id]) delete DB.nuoviContatti[r.id]; });
    (del[c] || []).forEach(function (t) { if (DB[c][t.id]) { delete DB[c][t.id]; n++; } });
  });
  return n;
}
function avviaSync() {
  if (!window.SyncMotore) return;
  SY = SyncMotore({
    nome: 'gc', dbNome: 'contatti_mobile_sync', clientId: GC_CLIENT_ID,
    collezioni: ['contatti', 'situazioni', 'eventi', 'pratiche', 'nuoviContatti'], singoli: ['config'], soloLettura: ['contatti', 'config'],
    locali: function () { return DB; }, applica: applicaRemoti,
    salvaLocale: function () { salva(true); },
    dopo: function (info) { if (info.applicati) { toast('Aggiornati ' + num(info.applicati) + ' record dal Mac'); if (schedaId) apriScheda(schedaId); else mostraVista(vista, true); } else if (vista === 'altro') disegnaAltro(); },
    stato: spia
  });
  SY.carica().then(function () { SY.avvia(); if (vista === 'altro') disegnaAltro(); });
}

/* ---------- avvio ---------- */
applicaTema(); applicaFs(); $('#versione').textContent = 'v' + APP_VER;
IDB.leggi('db').then(function (t) {
  if (t) { try { var j = JSON.parse(t); if (j && j.contatti) DB = Object.assign({ contatti: {}, situazioni: {}, eventi: {}, pratiche: {}, nuoviContatti: {}, config: {} }, j); } catch (e) {} }
  var v = 'cerca'; try { v = localStorage.getItem('cm.vista') || 'cerca'; } catch (e) {}
  if (v === 'vicino' || v === 'mappa') v = 'cerca';
  mostraVista(v); avviaSync();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
});
window.CM = { get DB() { return DB; }, get SY() { return SY; }, get MP() { return MP; }, apriScheda: apriScheda, mostraVista: mostraVista };
})();
</script>
</body>
</html>
