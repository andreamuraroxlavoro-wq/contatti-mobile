<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contatti">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<title>CONTATTI MOBILE</title>
<link rel="icon" href="icona-512-v2.png">
<link rel="icon" sizes="192x192" href="icona-192-v2.png">
<link rel="shortcut icon" href="favicon-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{color-scheme:light;
  --accent:#2a78d6;--accent-h:#1f63b8;--cremisi:#D51544;--verde:#1baf7a;--rosso:#d03b3b;--ambra:#b8860b;--grigioL:#9a9a9a;
  --sfondo:#f4f4f1;--carta:#fcfcfb;--carta2:#efeeea;--carta3:#e4e3dd;--testo:#0b0b0b;--testo2:#3d3c3a;--tenue:#66655f;--bordo:#e1e0d9;--hover:rgba(11,11,11,.035);--giallo:#fff8dc;--rosso-chiaro:#f8dcdc;
  --capo:#ffffff;--ombra:0 1px 2px rgba(0,0,0,.06);--fs:16px;--scala:1;
  --sz-clas:#1F4E8C;--sz-rec:#1C6B4A;--sz-ref:#D9741A;--sz-dim:#6A4C93;--sz-prof:#4B5A6B;--sz-sit:#0E7C86;--sz-prom:#A77A14;--sz-file:#3C6E9F;--sz-cron:#2a78d6;--sz-prat:#E8912D;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html[data-theme="scuro"]{color-scheme:dark;
  --accent:#3987e5;--accent-h:#4f97ee;--sfondo:#0d0d0d;--carta:#1a1a19;--carta2:#232322;--carta3:#2b2b29;--testo:#fff;--testo2:#d6d5cc;--tenue:#a3a19a;--bordo:#2c2c2a;--hover:rgba(255,255,255,.035);--giallo:#2a2a1f;--rosso-chiaro:#4a1f22;
  --capo:#161615;--ombra:0 1px 2px rgba(0,0,0,.5);--verde:#199e70;--rosso:#e66767;--ambra:#d4b25a;
  --sz-clas:#7FB0F0;--sz-rec:#5CB88E;--sz-ref:#F0A050;--sz-dim:#B596E0;--sz-prof:#9AA8BA;--sz-sit:#5CC8D0;--sz-prom:#E0BE60;--sz-file:#86B4E6;--sz-cron:#9FC0F2;--sz-prat:#F0A050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--sfondo);color:var(--testo);font-size:calc(16px * var(--scala));line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header.top{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--capo);padding:calc(8px + var(--sat)) 14px 8px;box-shadow:0 1px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px}
.marchio{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;overflow:hidden}
.marchio > div{min-width:0;overflow:hidden}
.marchio.solo-icona > div{display:none}
.marchio img{width:30px;height:30px;border-radius:8px}
.marchio b{display:inline-block;font-size:calc(12.5px * var(--scala));letter-spacing:.02em;white-space:nowrap;line-height:1.05}.marchio b .wd{display:block}
.marchio b .wa{color:var(--accent)}.marchio b .wd{color:var(--cremisi)}
.marchio small{display:block;font-size:calc(10px * var(--scala));color:var(--tenue);letter-spacing:.08em;margin-top:-2px}
@media (max-width:430px){.marchio small{display:none}header.top{gap:7px;padding-left:10px;padding-right:10px}.gruppi{gap:3px}.gruppi button{padding:5px 7px;font-size:calc(10.5px * var(--scala))}.marchio b{font-size:calc(11.5px * var(--scala))}}
.sp{flex:1}
#sy-spia{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--grigioL)}
#sy-spia svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
#sy-spia.sy-ok{color:var(--verde)}#sy-spia.sy-sync{color:var(--accent);animation:pulsa 1s ease-in-out infinite}#sy-spia.sy-errore{color:var(--rosso)}#sy-spia.sy-auth{color:var(--ambra);animation:pulsa 1s ease-in-out infinite}#sy-spia.sy-offline{color:var(--grigioL)}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.3}}
#tema{width:34px;height:34px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta);color:var(--testo);font-size:calc(16px * var(--scala))}
.hbt{width:36px;height:36px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta);color:var(--testo2);display:flex;align-items:center;justify-content:center}#bt-menu{background:var(--accent);border-color:var(--accent);color:#fff}#bt-menu svg{stroke-width:2.2}
.hbt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hbt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gruppi{display:flex;gap:4px;flex:none}
.gruppi button{border:1.5px solid var(--bordo);background:var(--carta);color:var(--tenue);border-radius:20px;padding:5px 9px;font-size:calc(11px * var(--scala));font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.gruppi button.on{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent));color:#fff}
.grsel{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.grsel .grc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bordo);border-radius:10px;padding:8px 11px;font-size:calc(14px * var(--scala));color:var(--testo);background:var(--carta);min-height:40px}
.grsel .grc i{display:inline-block;width:11px;height:11px;border-radius:3px}
.grsel .grc input{width:20px;height:20px;margin:0}
@media (max-width:360px){.marchio small{display:none}.gruppi button{padding:5px 7px;font-size:calc(10px * var(--scala))}}
main{padding:calc(60px + var(--sat)) 12px calc(74px + var(--sab));min-height:100%}
.vista{display:none}.vista.on{display:block}
nav.tab{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--capo);border-top:1px solid var(--bordo);display:flex;padding:4px 4px calc(4px + var(--sab))}
nav.tab button{flex:1;background:transparent;border:0;color:var(--tenue);font-size:calc(10.5px * var(--scala));padding:5px 2px 3px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;letter-spacing:.02em}
nav.tab button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tab button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
nav.tab button{min-width:0;white-space:nowrap;overflow:hidden}
@media (max-width:380px){nav.tab button{font-size:calc(9px * var(--scala));padding:5px 1px 3px}nav.tab button svg{width:21px;height:21px}nav.tab button .tn{margin-left:22px}}
nav.tab button .tn{position:absolute;margin-left:26px;margin-top:-4px;background:var(--cremisi);color:#fff;font-size:calc(10px * var(--scala));border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
/* ricerca e filtri */
.cerca{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cerca input{flex:1;padding:11px 12px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:max(16px, calc(16px * var(--scala)))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -12px 6px;padding-left:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bordo);background:var(--carta);color:var(--testo2);border-radius:20px;padding:6px 12px;font-size:calc(13px * var(--scala));white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.st.on{background:var(--cremisi);border-color:var(--cremisi)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.conta{font-size:calc(12px * var(--scala));color:var(--tenue);margin:0 2px 6px}
/* elenco */
.lista{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;overflow:hidden;box-shadow:var(--ombra)}
.riga{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bordo);cursor:pointer;min-height:58px}
.riga:last-child{border-bottom:0}.riga:active{background:var(--hover)}
.riga .tx{flex:1;min-width:0}
.riga .nm{font-weight:650;font-size:calc(15.5px * var(--scala));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga .ds{font-size:calc(12.5px * var(--scala));color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.riga .sopra{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.riga .sopra .tag-tipo{font-size:calc(10px * var(--scala));padding:1px 7px}.riga .sopra .pill{max-width:100%}.riga .sopra .pill.ref{background:color-mix(in srgb,var(--sz-ref) 18%,var(--carta));color:var(--sz-ref);font-weight:700}
.riga .dx{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gbar{display:inline-flex;gap:2px;flex:none;height:30px}.gbar i{display:block;width:4px;border-radius:2px;background:var(--carta3)}.gbar i.st.on{background:var(--cremisi)}.gbar i.cl.on{background:var(--accent)}
.pill{display:inline-block;font-size:calc(11px * var(--scala));padding:2px 8px;border-radius:20px;background:var(--carta2);color:var(--testo);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill.es{background:#E8F3EC;color:#1C6B4A}.pill.no{background:#F6E7E7;color:#C00000}.pill.at{background:#FBF3DF;color:#8A6D1F}.pill.gr-st{background:var(--cremisi);color:#fff;font-weight:600}.pill.gr-cl{background:var(--accent);color:#fff;font-weight:600}
html[data-theme="scuro"] .pill.es{background:#1E3A2C;color:#7BD3A5}html[data-theme="scuro"] .pill.no{background:#4A1F22;color:#F09090}html[data-theme="scuro"] .pill.at{background:#3B3320;color:#E5C670}
.liv{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;color:#fff;font-size:calc(11.5px * var(--scala));font-weight:800;text-align:center;vertical-align:middle}
.liv.A{background:#1C6B4A}.liv.B{background:var(--accent)}.liv.C{background:#8A6D1F}.liv.D{background:#9A9A9A}
.rq{display:inline-flex;align-items:center;gap:4px;font-size:calc(10px * var(--scala));font-weight:800;letter-spacing:.06em;padding:2px 8px 2px 3px;border-radius:999px;color:#fff;text-transform:uppercase}
.rq i{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:rgba(255,255,255,.3);font-style:normal;text-align:center;font-size:calc(10px * var(--scala))}
.rq.sospesa{background:#E8912D}.rq.accettata{background:#1C6B4A}.rq.rifiutata{background:#D51544}
.km{font-size:calc(12px * var(--scala));color:var(--accent);font-weight:700}
.btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);border-radius:10px;padding:9px 14px;font-weight:600;font-size:calc(14px * var(--scala))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.peri{color:var(--rosso);border-color:var(--rosso)}.btn.mini{padding:8px 12px;font-size:calc(13px * var(--scala));min-height:36px}
.btn:active{opacity:.75}
.vuoto{padding:22px 14px;color:var(--tenue);text-align:center;font-size:calc(14px * var(--scala))}
.altri{width:100%;padding:12px;background:var(--carta2);border:0;color:var(--accent);font-weight:600}
/* titoli di vista */
h1.tit{font-size:calc(13px * var(--scala));letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);font-weight:800;margin:14px 2px 8px}
h1.tit:first-child{margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:10px 12px;box-shadow:var(--ombra);border-left:5px solid var(--c,var(--accent))}
.kpi .et{font-size:calc(11.5px * var(--scala));color:var(--tenue);text-transform:uppercase;letter-spacing:.06em;font-weight:700}.kpi .nm{font-size:calc(26px * var(--scala));font-weight:800;line-height:1.1}
/* scheda */
#scheda{position:fixed;inset:0;z-index:3000;background:var(--sfondo);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .22s ease;padding:0 12px calc(30px + var(--sab))}
#scheda.on{transform:none}
.sc-top{position:sticky;top:0;z-index:5;background:var(--capo);margin:0 -12px 12px;padding:calc(8px + var(--sat)) 10px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.sc-top .ind{width:38px;height:38px;border:0;background:transparent;color:var(--accent);font-size:calc(22px * var(--scala));border-radius:10px}
.sc-top .tt{flex:1;min-width:0}.sc-top .tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:calc(17px * var(--scala));overflow:hidden;line-height:1.15}.sc-top .tt span{font-size:calc(12px * var(--scala));color:var(--tenue)}
.sz{border:1px solid var(--bordo);border-radius:14px;margin:0 0 12px;background:var(--carta);box-shadow:var(--ombra);overflow:hidden;border-left:6px solid var(--c)}
.sz>h3{margin:0;padding:9px 14px;border-bottom:1px solid var(--bordo);text-transform:uppercase;letter-spacing:.12em;font-size:calc(12px * var(--scala));font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--carta));display:flex;align-items:center;gap:6px}
.sz>h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c)}
.sz>h3 .pill{margin-left:auto;text-transform:none;letter-spacing:0}
.sz>.c{padding:12px 14px}
.sz-clas{--c:var(--sz-clas)}.sz-rec{--c:var(--sz-rec)}.sz-ref{--c:var(--sz-ref)}.sz-dim{--c:var(--sz-dim)}.sz-prof{--c:var(--sz-prof)}.sz-sit{--c:var(--sz-sit)}.sz-prom{--c:var(--sz-prom)}.sz-file{--c:var(--sz-file)}.sz-cron{--c:var(--sz-cron)}.sz-prat{--c:var(--sz-prat)}
dl.rg{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:calc(14.5px * var(--scala))}
dl.rg dt{color:var(--c);font-weight:600;opacity:.85;white-space:nowrap}dl.rg dd{margin:0;min-width:0;overflow-wrap:anywhere}
.az{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.az a,.az button{flex:1;min-width:30%;display:flex;align-items:center;justify-content:center;gap:6px;overflow-wrap:anywhere;padding:11px 8px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--carta));color:var(--c);font-weight:700;border:1px solid color-mix(in srgb,var(--c) 30%,var(--bordo));font-size:calc(14px * var(--scala))}
.az svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ref{border:1px solid var(--bordo);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--sz-ref) 4%,var(--carta))}
.ref b{display:block;font-size:calc(15px * var(--scala))}.ref .ru{font-size:calc(12.5px * var(--scala));color:var(--tenue)}.ref .az{margin-top:8px;flex-direction:column;gap:6px}.ref .az a{flex:none;width:100%;min-width:0;justify-content:flex-start;text-align:left;gap:9px;padding:10px 12px;line-height:1.3}
.form{display:grid;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:calc(12px * var(--scala));color:var(--tenue);font-weight:600}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--bordo);border-radius:10px;background:var(--carta);color:var(--testo);font-size:max(16px, calc(16px * var(--scala)));width:100%}
.form textarea{min-height:68px;resize:vertical}
.form .due{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media (max-width:430px){.form .due{grid-template-columns:1fr}.mp-pannello .due{grid-template-columns:1fr}}
.sz-prom textarea{background:var(--giallo)}
.ev{padding:9px 0;border-bottom:1px solid var(--bordo)}.ev:last-child{border-bottom:0}
.ev .d{font-size:calc(12px * var(--scala));color:var(--tenue);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .t{font-weight:650;margin-top:2px}.ev .n{font-size:calc(14px * var(--scala));color:var(--testo2);white-space:pre-wrap;margin-top:2px}
.ev .h{font-size:calc(14px * var(--scala));color:var(--testo2);margin-top:2px;overflow-wrap:anywhere}.ev .h img,.ev .h table{max-width:100%}.ev .h table{display:block;overflow-x:auto}.ev .h p{margin:4px 0}.ev .h ul{padding-left:18px;margin:4px 0}
.dir{font-size:calc(10px * var(--scala));font-weight:800;padding:1px 6px;border-radius:6px;background:var(--carta2)}.dir.out{color:var(--accent)}.dir.in{color:var(--verde)}
.stati{display:flex;gap:6px;margin-top:10px}.stati button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--bordo);background:var(--carta);font-weight:700;font-size:calc(13px * var(--scala));color:var(--testo2)}
.stati button.on.sospesa{background:#E8912D;color:#fff;border-color:#E8912D}.stati button.on.accettata{background:#1C6B4A;color:#fff;border-color:#1C6B4A}.stati button.on.rifiutata{background:#D51544;color:#fff;border-color:#D51544}
.tag-tipo{display:inline-block;color:#fff;font-weight:800;font-size:calc(11px * var(--scala));letter-spacing:.06em;padding:2px 9px;border-radius:999px;text-transform:uppercase}
.testo{font-size:calc(14.5px * var(--scala));color:var(--testo2);white-space:pre-wrap;margin:0}
.nota{background:var(--carta2);border-radius:10px;padding:9px 12px;font-size:calc(13.5px * var(--scala));color:var(--testo2)}
body.sc-aperta,body.mappa-on{overflow:hidden}
summary::-webkit-details-marker{display:none}
#mappa.chiusa{display:none}
.foglio{position:fixed;inset:0;z-index:3500;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.foglio .fg{background:var(--carta);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:14px 14px calc(16px + var(--sab))}
.foglio h4{margin:0 0 10px;font-size:calc(13px * var(--scala));letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.foglio button.v{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:calc(16px * var(--scala));font-weight:600;margin-bottom:8px}
.foglio label.ric{display:flex;align-items:center;gap:10px;font-size:calc(14px * var(--scala));color:var(--testo2);margin:4px 2px 12px;min-height:36px}.foglio input[type=checkbox]{width:22px;height:22px}
/* vista Mappa a tutto schermo */
#v-mappa.on{position:fixed;left:0;right:0;top:calc(52px + var(--sat));bottom:calc(62px + var(--sab));padding:0;z-index:5}
#mappa2{position:absolute;inset:0;background:var(--carta2)}
.mp-top{position:absolute;top:8px;left:8px;right:8px;z-index:1200;display:flex;gap:6px}
.mp-top input{flex:1;padding:9px 12px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:max(16px, calc(16px * var(--scala)));box-shadow:var(--ombra)}

/* toccando una riga del calendario: un «report da fare» porta direttamente al modulo del report,
   l'attività in programma si corregge, l'evento già registrato apre la scheda del cliente */
function calApri(k, id, cid) {
  if (k === 'cron') { apriScheda(cid); return; }    /* già documentata: apro la scheda del cliente */
  var a = attArchivio()[id]; if (!a) return;
  if (a.fatto) { calRegistra(a); return; }           /* svolta: vado a scrivere il report */
  attForm({ id: id });                               /* ancora da fare: è un programma, si corregge */
}
/* l'attività diventa svolta e si apre il modulo del report, già compilato con quello che so */
function calRegistra(a) {
  var canale = { visita: 'Visita', telefonata: 'Telefono', mail: 'Email' }[a.tipo] || '';
  if (!a.fatto) { attSegnaFatta(a.id, true); if (vista === 'cal') disegnaCal(); }
  apriReportCliente(a.cid, { d: a.d, o: a.o || '', c: canale, t: a.nota || '' });
}
function apriReportCliente(cid, pre) {
  apriScheda(cid);
  setTimeout(function () {
    var d = $('#sc-nuovo'); if (!d) return;
    d.open = true;
    if (pre) ['d', 'o', 'c', 't'].forEach(function (k) { var e = $('#ev-' + k); if (e && pre[k]) e.value = pre[k]; });
    d.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var t = $('#ev-t'); if (t) setTimeout(function () { t.focus(); }, 350);
  }, 220);
}

/* cerca un cliente per nome dell'azienda oppure per persona di riferimento */
function attTrova(t) {
  t = String(t || '').trim().toLowerCase(); if (t.length < 2) return [];
  var L = lista(), out = [], visti = {};
  L.forEach(function (c) { if (out.length < 10 && c.nome.toLowerCase().indexOf(t) >= 0) { out.push({ c: c, via: '' }); visti[c.id] = 1; } });
  L.forEach(function (c) {
    if (out.length >= 10 || visti[c.id]) return;
    var r = referentiDi(c).filter(function (x) { return [x.nome, x.ruolo, x.email, x.tel, x.cell].join(' ').toLowerCase().indexOf(t) >= 0; })[0];
    if (r) { out.push({ c: c, via: 'referente: ' + r.nome + (r.ruolo ? ' · ' + r.ruolo : '') }); visti[c.id] = 1; return; }
    var rf = (sit(c.id).referente || '');
    if (rf.toLowerCase().indexOf(t) >= 0) { out.push({ c: c, via: 'referente: ' + rf }); visti[c.id] = 1; }
  });
  return out;
}

/* ---------- foglio «che cosa vuoi fare» ----------
   Primo passo: si sceglie l'azione. Visita, Telefonata e Mail finiscono in calendario come attività
   da fare; Report porta dritto alla scheda del cliente, nel punto dove si scrive il report.
   Il cliente è sempre obbligatorio: finché non lo scegli, non si va avanti. */
function attForm(o) {
  o = o || {};
  var esistente = o.id ? attArchivio()[o.id] : null;
  var a = esistente ? JSON.parse(JSON.stringify(esistente)) : { tipo: o.tipo || '', d: o.d || oggi(), cid: o.cid || '' };
  var nuovo = !esistente;
  var f = el('div', 'foglio att-f');
  function chiudi() { f.remove(); }

  function cercatore(dopo) {
    var ce = $('#att-cerca', f); if (!ce) return;
    ce.addEventListener('input', function () {
      var t = ce.value.trim().toLowerCase();
      if (t.length < 2) { $('#att-sugg', f).innerHTML = ''; return; }
      var l = attTrova(t);
      $('#att-sugg', f).innerHTML = l.length
        ? l.map(function (x) { return '<button data-c="' + esc(x.c.id) + '">' + esc(x.c.nome) + (x.c.prov ? '<span> · ' + esc(x.c.prov) + '</span>' : '') + (x.via ? '<i>' + esc(x.via) + '</i>' : '') + '</button>'; }).join('')
        : '<div class="vuoto">Nessun cliente e nessun referente con questo nome.</div>';
      $$('#att-sugg button', f).forEach(function (b) { b.addEventListener('click', function () { a.cid = b.dataset.c; dopo(); }); });
    });
  }
  function avvisoCliente() {
    var av = $('#att-avviso', f);
    if (av) { av.textContent = 'Scegli prima il cliente: scrivi il nome e toccalo nell\'elenco.'; av.style.display = 'block'; }
    var ce = $('#att-cerca', f); if (ce) ce.focus();
    toast('Manca il cliente');
  }

  /* passo 1 */
  function disegnaScelta() {
    var h = ['<div class="fg"><h4>Che cosa vuoi fare?</h4><div class="att-scelta">'];
    ATT_PIANIFICA.forEach(function (t) {
      h.push('<button class="t-' + t.id + '" data-t="' + t.id + '">' + CAL_ICO[t.ico] + '<b>' + esc(t.nome) + '</b><span>da fare: va in calendario</span></button>');
    });
    h.push('<button class="t-report" data-t="report">' + CAL_ICO.report + '<b>Report</b><span>gi&agrave; fatta: la racconto adesso</span></button>');
    h.push('</div><div class="az"><button class="btn" id="att-ann">Annulla</button></div></div>');
    f.innerHTML = h.join('');
    $('#att-ann', f).addEventListener('click', chiudi);
    $$('.att-scelta button', f).forEach(function (b) {
      b.addEventListener('click', function () {
        a.tipo = b.dataset.t;
        if (a.tipo === 'report') { if (a.cid) { var cid = a.cid; chiudi(); apriReportCliente(cid, { d: a.d }); } else disegnaClienteReport(); }
        else disegna();
      });
    });
  }

  /* passo 2 del report */
  function disegnaClienteReport() {
    f.innerHTML = '<div class="fg"><h4>Report: per quale cliente?</h4>' +
      '<div class="att-c"><label>Cliente</label><input type="search" id="att-cerca" placeholder="Nome del cliente…" autocomplete="off"><div class="att-sugg" id="att-sugg"></div>' +
      '<div class="att-avviso" id="att-avviso" style="display:none"></div></div>' +
      '<div class="az"><button class="btn" id="att-indietro">Indietro</button><button class="btn" id="att-ann">Annulla</button></div></div>';
    $('#att-ann', f).addEventListener('click', chiudi);
    $('#att-indietro', f).addEventListener('click', function () { a.tipo = ''; disegnaScelta(); });
    cercatore(function () { var cid = a.cid; chiudi(); apriReportCliente(cid, { d: a.d }); });
    setTimeout(function () { var ce = $('#att-cerca', f); if (ce) ce.focus(); }, 120);
  }

  /* passo 2 dell'attività */
  function disegna() {
    var c = a.cid ? DB.contatti[a.cid] : null;
    var h = ['<div class="fg">'];
    h.push('<h4>' + (nuovo ? 'Nuova attività' : 'Attività in programma') + '</h4>');
    h.push('<div class="att-c"><label>Cliente</label>' + (c
      ? '<div class="att-cli"><b>' + esc(c.nome) + '</b>' + (c.prov ? ' <span>· ' + esc(c.prov) + '</span>' : '') + '<button class="btn" id="att-cambia">cambia</button></div>'
      : '<input type="search" id="att-cerca" placeholder="Nome del cliente…" autocomplete="off"><div class="att-sugg" id="att-sugg"></div>') +
      '<div class="att-avviso" id="att-avviso" style="display:none"></div></div>');
    h.push('<div class="att-c"><label>Che cosa</label><div class="att-tipi">' + ATT_PIANIFICA.map(function (t) {
      return '<button class="chip t-' + t.id + (a.tipo === t.id ? ' on' : '') + '" data-t="' + t.id + '">' + CAL_ICO[t.ico] + esc(t.nome) + '</button>';

    h.push('<div class="due"><label>Giorno <input type="date" id="att-d" value="' + esc(a.d || '') + '"></label><label>Orario <input type="time" id="att-o" value="' + esc(a.o || '') + '"' + (a.oraLibera ? ' disabled' : '') + '></label></div>');
    h.push('<label class="ric"><input type="checkbox" id="att-lib"' + (a.oraLibera ? ' checked' : '') + '> Orario libero</label>');
    h.push('<label>Nota sull\'orario <input type="text" id="att-on" value="' + esc(a.oraNota || '') + '" placeholder="per esempio: in mattinata dopo le 11:00"></label>');
    h.push('<label>Nota <textarea id="att-n" rows="2" placeholder="Che cosa devo fare o portare…">' + esc(a.nota || '') + '</textarea></label>');
    if (!nuovo) h.push('<label class="ric"><input type="checkbox" id="att-f"' + (a.fatto ? ' checked' : '') + '> Attività già svolta</label>' +
      '<button class="btn pri" id="att-rep" style="width:100%;margin-bottom:10px">' + (a.fatto ? 'Registra il report' : 'Fatta: registra il report') + '</button>');
    h.push('<div class="az">' + (nuovo ? '' : '<button class="btn peri" id="att-del">Elimina</button>') +
      (nuovo && !o.tipo && !o.id ? '<button class="btn" id="att-indietro">Indietro</button>' : '<button class="btn" id="att-ann">Annulla</button>') +
      '<button class="btn pri" id="att-ok">Salva</button></div></div>');
    f.innerHTML = h.join('');

    cercatore(disegna);
    var cb = $('#att-cambia', f); if (cb) cb.addEventListener('click', function () { a.cid = ''; disegna(); });
    function raccogli() { a.d = $('#att-d', f).value; a.o = $('#att-o', f).value; a.oraNota = $('#att-on', f).value; a.nota = $('#att-n', f).value; }
    $$('.att-tipi .chip', f).forEach(function (b) { b.addEventListener('click', function () { raccogli(); a.tipo = b.dataset.t; disegna(); }); });
    var lib = $('#att-lib', f);
    lib.addEventListener('change', function () { raccogli(); a.oraLibera = lib.checked ? 1 : 0; if (lib.checked) a.o = ''; disegna(); });
    var an = $('#att-ann', f); if (an) an.addEventListener('click', chiudi);
    var ind = $('#att-indietro', f); if (ind) ind.addEventListener('click', function () { raccogli(); a.tipo = ''; disegnaScelta(); });
    var rb = $('#att-rep', f);
    if (rb) rb.addEventListener('click', function () {
      if (!a.cid) { avvisoCliente(); return; }
      raccogli(); attSalva(a); chiudi(); calRegistra(attArchivio()[a.id] || a);
    });
    var dl = $('#att-del', f);
    if (dl) dl.addEventListener('click', function () { if (!confirm('Elimino questa attività dal calendario?')) return; attElimina(a.id); chiudi(); dopo(a.d); });
    $('#att-ok', f).addEventListener('click', function () {
      if (!a.cid) { avvisoCliente(); return; }
      raccogli();
      if (!a.d) { toast('Metti il giorno'); return; }
      a.oraLibera = lib.checked ? 1 : 0; if (lib.checked) a.o = '';
      if (!a.oraLibera) delete a.oraLibera;
      a.oraNota = (a.oraNota || '').trim(); if (!a.oraNota) delete a.oraNota;
      a.nota = (a.nota || '').trim(); if (!a.nota) delete a.nota;
      var ff = $('#att-f', f); if (ff) { if (ff.checked) a.fatto = 1; else delete a.fatto; }
      attSalva(a); chiudi(); toast('Attività in calendario'); dopo(a.d);
    });
  }
  function dopo(d) {
    if (vista === 'cal') { if (d) { CAL.sel = d; CAL.rif = d; } disegnaCal(); }
    else if (document.body.classList.contains('sc-aperta') && schedaId) apriScheda(schedaId);
    else if (vista === 'oggi') disegnaOggi();
  }
  f.addEventListener('click', function (e) { if (e.target === f) chiudi(); });
  document.body.appendChild(f);
  if (a.tipo || !nuovo) disegna(); else disegnaScelta();
}

/* ---------- blocco «In programma» nella scheda ---------- */
function bloccoProgramma(id) {
  var og = oggi(), l = attDi(id);
  var v = l.filter(function (a) { return !a.fatto && a.d < og; }).concat(l.filter(function (a) { return !a.fatto && a.d >= og; })).slice(0, 6);
  var h = '<div class="sz sz-prog" style="--c:#6B4FA0"><h3>In programma<span class="pill">' + num(l.filter(function (a) { return !a.fatto; }).length) + '</span></h3><div class="c"><div class="cl-el">';
  if (!v.length) h += '<div class="vuoto">Nessuna attività in calendario per questo cliente.</div>';
  v.forEach(function (a) {
    h += '<div class="cl-r"><button class="cl-e t-' + a.tipo + (a.d < og ? ' tardi' : ' dafare') + '" data-att="' + esc(a.id) + '">' + attIco(a.tipo) +
      '<span class="eo">' + esc(dataIt(a.d)) + (a.o ? ' ' + esc(a.o) : a.oraLibera ? ' libero' : '') + '</span><span class="en">' + esc(a.nota || attTipo(a.tipo).nome) + '</span></button>' +
      '<span class="cl-n">' + esc([attTipo(a.tipo).nome, a.oraNota].filter(Boolean).join(' · ')) + '</span></div>';
  });

  return h + '</div></div></div>';
}
function agganciaProgramma(id) {
  var p = $('#sc-piu'); if (p) p.addEventListener('click', function () { attForm({ cid: id }); });
  $$('#scheda [data-att]').forEach(function (b) { b.addEventListener('click', function () { calApri('app', b.dataset.att, id); }); });
}

/* VICINO A ME */
var mappa = null, posMe = null, livelloPin = null;
function distKm(a, b, c, d) { var R = 6371, dLat = (c - a) * Math.PI / 180, dLng = (d - b) * Math.PI / 180, x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2); return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); }
function kmIt(k) { return k < 10 ? k.toLocaleString('it-IT', { maximumFractionDigits: 1 }) : Math.round(k).toLocaleString('it-IT'); }
function disegnaVicino() {
  var box = $('#vi-lista'), conta_ = $('#vi-conta');
  if (!posMe) { conta_.textContent = 'Cerco la tua posizione…'; box.innerHTML = '';
    if (!navigator.geolocation) { conta_.textContent = 'Posizione non disponibile su questo dispositivo.'; return; }
    navigator.geolocation.getCurrentPosition(function (p) { posMe = { lat: p.coords.latitude, lng: p.coords.longitude }; disegnaVicino(); }, function (e) { conta_.textContent = 'Posizione non concessa (' + e.message + '). Attiva la localizzazione per il browser.'; }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    return;
  }
  var raggio = +$('#vi-raggio').value;
  var L = lista().filter(function (c) { return c.lat && c.lng; }).map(function (c) { return { c: c, km: distKm(posMe.lat, posMe.lng, +c.lat, +c.lng) }; }).filter(function (x) { return x.km <= raggio; }).sort(function (a, b) { return a.km - b.km; });
  conta_.textContent = num(L.length) + ' contatti entro ' + raggio + ' km' + (L.length > 200 ? ' (in elenco i 200 più vicini)' : '');
  box.innerHTML = ''; var frag = document.createDocumentFragment();
  L.slice(0, 200).forEach(function (x) { frag.appendChild(rigaContatto(x.c, '<span class="km">' + kmIt(x.km) + ' km</span>')); }); box.appendChild(frag);
  if (vista === 'vicino') { inVista = L.map(function (x) { return x.c; }); aggiornaFab(); }
  if (!L.length) box.innerHTML = '<div class="vuoto">Nessun contatto con coordinate entro ' + raggio + ' km.</div>';
  if (window.L) {
    if (!mappa) { mappa = window.L.map('mappa', { zoomControl: false }); window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(mappa); livelloPin = window.L.layerGroup().addTo(mappa); }
    livelloPin.clearLayers();
    window.L.marker([posMe.lat, posMe.lng], { zIndexOffset: 2000, icon: window.L.divIcon({ className: 'lp-wrap', iconSize: [0, 0], html: '<div class="qui-punto"><i></i><i></i><i></i></div>' }) }).addTo(livelloPin).bindPopup('Tu sei qui');
    /* stessi segnaposto e stessi fumetti della scheda Mappa: un solo modo di disegnare i contatti */
    L.slice(0, 300).forEach(function (x) {
      var c = x.c, m = window.L.marker([+c.lat, +c.lng], { icon: iconaPin(c, 0, 0), riseOnHover: true }).addTo(livelloPin);
      m.bindPopup(function () { return popupPin(c).replace('</div></div>', '</div><div class="pop-km">' + kmIt(x.km) + ' km da qui</div></div>'); }, { maxWidth: 280, autoPanPaddingTopLeft: [10, 60], autoPanPaddingBottomRight: [10, 60] });
      m.off('click', m._openPopup, m); m.on('click', function () { if (!m.isPopupOpen()) m.openPopup(); });
      m.on('popupopen', function () { pinSel = c.id; aggiornaFab(); });
      m.on('popupclose', function () { if (pinSel === c.id) { pinSel = ''; aggiornaFab(); } });
    });
    var b = window.L.latLng(posMe.lat, posMe.lng).toBounds(Math.min(raggio, 50) * 1000); mappa.fitBounds(b);
    setTimeout(function () { mappa.invalidateSize(); }, 200);
    mappa.off('popupopen'); mappa.on('popupopen', function (e) {
      var el_ = e.popup.getElement();
      var a = el_.querySelector('[data-apri]'); if (a) a.addEventListener('click', function (ev) { ev.preventDefault(); mappa.closePopup(); apriScheda(a.dataset.apri); });
      var nv = el_.querySelector('[data-nav]'); if (nv) nv.addEventListener('click', function () { naviga(DB.contatti[nv.dataset.nav]); });
    });
  }
}
$('#vi-ricalcola').addEventListener('click', function () { posMe = null; disegnaVicino(); });
$('#vi-mappa').addEventListener('click', function () { var m = $('#mappa'), ch = m.classList.toggle('chiusa'); this.textContent = ch ? 'Mostra mappa' : 'Nascondi mappa'; try { localStorage.setItem('cm.mappa', ch ? '0' : '1'); } catch (e) {} if (!ch && mappa) setTimeout(function () { mappa.invalidateSize(); }, 100); });
try { if (localStorage.getItem('cm.mappa') === '0') { $('#mappa').classList.add('chiusa'); $('#vi-mappa').textContent = 'Mostra mappa'; } } catch (e) {}

/* MAPPA — stessa resa di GESTIONE CONTATTI: segnaposto a goccia, colore per livello (o per esito), bordo tratteggiato
   per chi è solo sul capoluogo di provincia, bollino con la sigla della pratica. I segnaposto vengono disegnati solo
   nell'area visibile (con un margine), così il telefono resta fluido anche con migliaia di contatti. */
var PIN = 'M0 0C-2.2-4.4-5.5-6.6-5.5-10.5A5.5 5.5 0 1 1 5.5-10.5C5.5-6.6 2.2-4.4 0 0Z';
var COL_LIV = { A: '#1C6B4A', B: '#2B5A9E', C: '#B08A2E', D: '#9A9A9A' }, COL_VIG = '#F2711C', COL_NUOVO = '#4FA8E8';
var MP = { mappa: null, pins: null, qui: null, colore: 'liv', f: { q: '', prov: '', esito: '', liv: '', cat: '', orig: '', prat: '' }, leg: false, posMe: null, tot: 0, vis: 0 };
try { Object.assign(MP.f, JSON.parse(localStorage.getItem('cm.mappa.f') || '{}')); MP.colore = localStorage.getItem('cm.mappa.col') || 'liv'; } catch (e) {}
function colLiv(c) { return COL_LIV[c.liv] || '#555'; }
function coloreMappa(c) { var es = sit(c.id).esito; if (MP.colore === 'esito') return colEsito(es); if (c.cat === 'Istituto di Vigilanza') return COL_VIG; return c.fonte === 'assodimi' ? colLiv(c) : COL_NUOVO; }
function badgePin(c) { var q = DB.pratiche[c.id]; if (!q) return ''; var t = tipoP(q), k = q.stato || 'sospesa', sc = k === 'sospesa' ? '#E8912D' : k === 'accettata' ? '#1C6B4A' : '#D51544'; return '<g class="rq-badge' + (k === 'sospesa' ? ' rq-lampo-pin' : '') + '"><circle cx="5.2" cy="-15.2" r="4.1" fill="' + esc(t.colore) + '" stroke="' + sc + '" stroke-width="1.3"/><text x="5.2" y="-13.3" font-size="5.2" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">' + esc(t.sigla || '') + '</text></g>'; }
function iconaPin(c, ox, oy) { return window.L.divIcon({ className: 'lp-wrap', iconSize: [0, 0], html: '<div class="lpin' + (c.geo === 'provincia' ? ' prov' : '') + '" style="--ox:' + (ox || 0).toFixed(1) + ';--oy:' + (oy || 0).toFixed(1) + ';--b:' + (c.fonte === 'assodimi' ? 1 : 1.3) + '"><svg viewBox="-7 -17 14 18"><path class="ombra" d="' + PIN + '" transform="translate(0.6 0.8)"/><path class="corpo" d="' + PIN + '" fill="' + coloreMappa(c) + '"/><circle class="occhio" cx="0" cy="-10.5" r="2.3"/>' + badgePin(c) + '</svg></div>' }); }
function filtratiMappa() {
  var f = MP.f, q = normNome(f.q).trim(), parole = q ? q.split(/\s+/) : [];
  return lista().filter(function (c) {
    if (!c.lat || !c.lng) return false;

    if (f.liv && c.liv !== f.liv) return false;
    if (f.cat && c.cat !== f.cat) return false;
    if (f.orig === 'asso' && c.fonte !== 'assodimi') return false;
    if (f.orig === 'nuovo' && c.fonte === 'assodimi') return false;
    var k = sit(c.id);
    if (f.esito === '(nessuno)') { if (k.esito && k.esito !== 'Da contattare') return false; } else if (f.esito && k.esito !== f.esito) return false;
    var q2 = DB.pratiche[c.id]; if (f.prat === 'si' && !q2) return false; if (f.prat && f.prat !== 'si' && !(q2 && (q2.stato || 'sospesa') === f.prat)) return false;

  });
}
function popupPin(c) {

  return '<div class="pop"><b>' + esc(c.nome) + '</b><div class="ds">' + [c.prov, c.cat, c.sede].filter(Boolean).map(esc).join(' · ') + '</div><div style="margin-top:4px">' + (c.liv ? '<span class="liv ' + esc(c.liv) + '">' + esc(c.liv) + '</span> ' : '') + pillEsito(k.esito) + (k.richiamo ? ' <span class="pill">&#8635; ' + dataIt(k.richiamo) + '</span>' : '') + ' ' + tagPratica(c) + '</div><div class="az"><button data-apri="' + esc(c.id) + '">Scheda</button>' + (tel ? '<a href="tel:' + esc(tel) + '">Chiama</a>' : '') + '<button data-nav="' + esc(c.id) + '">Naviga</button></div></div>';
}
function disegnaPin() {
  if (!MP.mappa) return;
  /* con un fumetto aperto non ridisegno (lo spostamento automatico della mappa lo chiuderebbe): rimando alla chiusura */
  if (MP.mappa._popup && MP.mappa._popup.isOpen && MP.mappa._popup.isOpen()) { MP.ridisegna = true; return; }
  MP.ridisegna = false;
  var L_ = window.L, b = MP.mappa.getBounds().pad(0.3), tutti = filtratiMappa(), dentro = tutti.filter(function (c) { return b.contains([+c.lat, +c.lng]); });
  MP.tot = tutti.length; MP.vis = dentro.length;
  var MAX = 1200, taglio = dentro.length > MAX;

/* ---------- aggiornamenti dell'app ---------- */
/* l'app pubblicata puo' cambiare mentre quella installata resta in memoria: controllo la versione in rete e avviso */
var aggUltimo = 0, aggVersione = '';

function controllaAggiornamenti(manuale) {
  var ora = Date.now();

    var m = x.match(/APP_VER\s*=\s*'([\d.]+)'/); if (!m) return;
    if (m[1] === APP_VER) { aggVersione = ''; barraAgg(false); if (manuale) toast('Hai già l’ultima versione (v' + APP_VER + ')'); return; }

}
function applicaAggiornamento() {
  toast('Aggiorno l’app…', 6000);

  try { if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); } catch (e) {}
