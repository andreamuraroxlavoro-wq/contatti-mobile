<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contatti">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<title>CONTATTI MOBILE</title>
<link rel="icon" href="icona-512-v2.png">
<link rel="icon" sizes="192x192" href="icona-192-v2.png">
<link rel="shortcut icon" href="favicon-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{color-scheme:light;
  --accent:#2a78d6;--accent-h:#1f63b8;--cremisi:#D51544;--verde:#1baf7a;--rosso:#d03b3b;--ambra:#b8860b;--grigioL:#9a9a9a;
  --sfondo:#f4f4f1;--carta:#fcfcfb;--carta2:#efeeea;--carta3:#e4e3dd;--testo:#0b0b0b;--testo2:#3d3c3a;--tenue:#66655f;--bordo:#e1e0d9;--hover:rgba(11,11,11,.035);--giallo:#fff8dc;--rosso-chiaro:#f8dcdc;
  --capo:#ffffff;--ombra:0 1px 2px rgba(0,0,0,.06);--fs:16px;--scala:1;
  --sz-clas:#1F4E8C;--sz-rec:#1C6B4A;--sz-ref:#D9741A;--sz-dim:#6A4C93;--sz-prof:#4B5A6B;--sz-sit:#0E7C86;--sz-prom:#A77A14;--sz-file:#3C6E9F;--sz-cron:#2a78d6;--sz-prat:#E8912D;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html[data-theme="scuro"]{color-scheme:dark;
  --accent:#3987e5;--accent-h:#4f97ee;--sfondo:#0d0d0d;--carta:#1a1a19;--carta2:#232322;--carta3:#2b2b29;--testo:#fff;--testo2:#d6d5cc;--tenue:#a3a19a;--bordo:#2c2c2a;--hover:rgba(255,255,255,.035);--giallo:#2a2a1f;--rosso-chiaro:#4a1f22;
  --capo:#161615;--ombra:0 1px 2px rgba(0,0,0,.5);--verde:#199e70;--rosso:#e66767;--ambra:#d4b25a;
  --sz-clas:#7FB0F0;--sz-rec:#5CB88E;--sz-ref:#F0A050;--sz-dim:#B596E0;--sz-prof:#9AA8BA;--sz-sit:#5CC8D0;--sz-prom:#E0BE60;--sz-file:#86B4E6;--sz-cron:#9FC0F2;--sz-prat:#F0A050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--sfondo);color:var(--testo);font-size:calc(16px * var(--scala));line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header.top{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--capo);padding:calc(8px + var(--sat)) 14px 8px;box-shadow:0 1px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px}
.marchio{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;overflow:hidden}
.marchio > div{min-width:0;overflow:hidden}
.marchio.solo-icona > div{display:none}
.marchio img{width:30px;height:30px;border-radius:8px}
.marchio b{display:inline-block;font-size:calc(12.5px * var(--scala));letter-spacing:.02em;white-space:nowrap;line-height:1.05}.marchio b .wd{display:block}
.marchio b .wa{color:var(--accent)}.marchio b .wd{color:var(--cremisi)}
.marchio small{display:block;font-size:calc(10px * var(--scala));color:var(--tenue);letter-spacing:.08em;margin-top:-2px}
@media (max-width:430px){.marchio small{display:none}header.top{gap:7px;padding-left:10px;padding-right:10px}.gruppi{gap:3px}.gruppi button{padding:5px 7px;font-size:calc(10.5px * var(--scala))}.marchio b{font-size:calc(11.5px * var(--scala))}}
.sp{flex:1}
#sy-spia{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--grigioL)}
#sy-spia svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
#sy-spia.sy-ok{color:var(--verde)}#sy-spia.sy-sync{color:var(--accent);animation:pulsa 1s ease-in-out infinite}#sy-spia.sy-errore{color:var(--rosso)}#sy-spia.sy-auth{color:var(--ambra);animation:pulsa 1s ease-in-out infinite}#sy-spia.sy-offline{color:var(--grigioL)}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.3}}
#tema{width:34px;height:34px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta);color:var(--testo);font-size:calc(16px * var(--scala))}
.hbt{width:36px;height:36px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta);color:var(--testo2);display:flex;align-items:center;justify-content:center}#bt-menu{background:var(--accent);border-color:var(--accent);color:#fff}#bt-menu svg{stroke-width:2.2}
.hbt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hbt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gruppi{display:flex;gap:4px;flex:none}
.gruppi button{border:1.5px solid var(--bordo);background:var(--carta);color:var(--tenue);border-radius:20px;padding:5px 9px;font-size:calc(11px * var(--scala));font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.gruppi button.on{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent));color:#fff}
.grsel{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.grsel .grc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bordo);border-radius:10px;padding:8px 11px;font-size:calc(14px * var(--scala));color:var(--testo);background:var(--carta);min-height:40px}
.grsel .grc i{display:inline-block;width:11px;height:11px;border-radius:3px}
.grsel .grc input{width:20px;height:20px;margin:0}
@media (max-width:360px){.marchio small{display:none}.gruppi button{padding:5px 7px;font-size:calc(10px * var(--scala))}}
main{padding:calc(60px + var(--sat)) 12px calc(74px + var(--sab));min-height:100%}
.vista{display:none}.vista.on{display:block}
nav.tab{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--capo);border-top:1px solid var(--bordo);display:flex;padding:4px 4px calc(4px + var(--sab))}
nav.tab button{flex:1;background:transparent;border:0;color:var(--tenue);font-size:calc(10.5px * var(--scala));padding:5px 2px 3px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;letter-spacing:.02em}
nav.tab button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tab button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
nav.tab button{min-width:0;white-space:nowrap;overflow:hidden}
@media (max-width:380px){nav.tab button{font-size:calc(9px * var(--scala));padding:5px 1px 3px}nav.tab button svg{width:21px;height:21px}nav.tab button .tn{margin-left:22px}}
nav.tab button .tn{position:absolute;margin-left:26px;margin-top:-4px;background:var(--cremisi);color:#fff;font-size:calc(10px * var(--scala));border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
/* ricerca e filtri */
.cerca{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cerca input{flex:1;padding:11px 12px;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);color:var(--testo);font-size:max(16px, calc(16px * var(--scala)))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -12px 6px;padding-left:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bordo);background:var(--carta);color:var(--testo2);border-radius:20px;padding:6px 12px;font-size:calc(13px * var(--scala));white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.st.on{background:var(--cremisi);border-color:var(--cremisi)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.conta{font-size:calc(12px * var(--scala));color:var(--tenue);margin:0 2px 6px}
/* elenco */
.lista{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;overflow:hidden;box-shadow:var(--ombra)}
.riga{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bordo);cursor:pointer;min-height:58px}
.riga:last-child{border-bottom:0}.riga:active{background:var(--hover)}
.riga .tx{flex:1;min-width:0}
.riga .nm{font-weight:650;font-size:calc(15.5px * var(--scala));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga .ds{font-size:calc(12.5px * var(--scala));color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.riga .sopra{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.riga .sopra .tag-tipo{font-size:calc(10px * var(--scala));padding:1px 7px}.riga .sopra .pill{max-width:100%}.riga .sopra .pill.ref{background:color-mix(in srgb,var(--sz-ref) 18%,var(--carta));color:var(--sz-ref);font-weight:700}
.riga .dx{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gbar{display:inline-flex;gap:2px;flex:none;height:30px}.gbar i{display:block;width:4px;border-radius:2px;background:var(--carta3)}.gbar i.st.on{background:var(--cremisi)}.gbar i.cl.on{background:var(--accent)}
.pill{display:inline-block;font-size:calc(11px * var(--scala));padding:2px 8px;border-radius:20px;background:var(--carta2);color:var(--testo);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill.es{background:#E8F3EC;color:#1C6B4A}.pill.no{background:#F6E7E7;color:#C00000}.pill.at{background:#FBF3DF;color:#8A6D1F}.pill.gr-st{background:var(--cremisi);color:#fff;font-weight:600}.pill.gr-cl{background:var(--accent);color:#fff;font-weight:600}
html[data-theme="scuro"] .pill.es{background:#1E3A2C;color:#7BD3A5}html[data-theme="scuro"] .pill.no{background:#4A1F22;color:#F09090}html[data-theme="scuro"] .pill.at{background:#3B3320;color:#E5C670}
.liv{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;color:#fff;font-size:calc(11.5px * var(--scala));font-weight:800;text-align:center;vertical-align:middle}
.liv.A{background:#1C6B4A}.liv.B{background:var(--accent)}.liv.C{background:#8A6D1F}.liv.D{background:#9A9A9A}
.rq{display:inline-flex;align-items:center;gap:4px;font-size:calc(10px * var(--scala));font-weight:800;letter-spacing:.06em;padding:2px 8px 2px 3px;border-radius:999px;color:#fff;text-transform:uppercase}
.rq i{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:rgba(255,255,255,.3);font-style:normal;text-align:center;font-size:calc(10px * var(--scala))}
.rq.sospesa{background:#E8912D}.rq.accettata{background:#1C6B4A}.rq.rifiutata{background:#D51544}
.km{font-size:calc(12px * var(--scala));color:var(--accent);font-weight:700}
.btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);border-radius:10px;padding:9px 14px;font-weight:600;font-size:calc(14px * var(--scala))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.peri{color:var(--rosso);border-color:var(--rosso)}.btn.mini{padding:8px 12px;font-size:calc(13px * var(--scala));min-height:36px}
.btn:active{opacity:.75}
.vuoto{padding:22px 14px;color:var(--tenue);text-align:center;font-size:calc(14px * var(--scala))}
/* CRONOLOGIA */
.cg-testa{position:sticky;top:0;z-index:12;background:var(--sfondo);padding:6px 0 4px;margin-bottom:8px}
.cg-per{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cg-per .hbt{flex:none;width:38px;height:38px;font-size:calc(20px * var(--scala));line-height:1}
.cg-per .hbt.vuota{visibility:hidden}
.cg-nome{flex:1;min-width:0;border:1px solid var(--bordo);background:var(--carta);color:var(--testo);border-radius:12px;padding:9px 10px;font:inherit;font-weight:700;
  font-size:calc(15px * var(--scala));text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-cerca{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cg-cerca input{flex:1;min-width:0}
.cg-cerca .hbt{flex:none;width:38px;height:38px}
.cg-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cg-k > div{border:1px solid var(--bordo);border-radius:12px;padding:8px 6px;text-align:center;background:var(--sfondo2,var(--carta))}
.cg-k b{display:block;font-size:calc(19px * var(--scala));line-height:1.15}
.cg-k span{font-size:calc(11.5px * var(--scala));color:var(--tenue)}
.cg-tl{display:flex;flex-direction:column;gap:8px}
.cg-mese{margin:12px 0 2px;font-size:calc(11.5px * var(--scala));font-weight:800;letter-spacing:.14em;color:var(--tenue)}
.cg-giorno{position:sticky;top:var(--cgT,150px);z-index:4;background:var(--sfondo);padding:6px 0 4px;font-weight:700;font-size:calc(14px * var(--scala));
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--bordo)}
.cg-giorno span{font-weight:500;font-size:calc(12px * var(--scala));color:var(--tenue)}
.cg-giorno.oggi{color:var(--accent)}
.cg-v{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--carta);border:1px solid var(--bordo);border-left:5px solid var(--tc,var(--accent));
  border-radius:12px;padding:9px 11px;box-shadow:var(--ombra)}
.cg-v:active{background:var(--hover)}
.cg-v-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:calc(12px * var(--scala));color:var(--tenue)}
.cg-o{font-weight:700;color:var(--tc,var(--accent))}
.cg-tp{border:1px solid color-mix(in srgb,var(--tc) 40%,var(--bordo));color:var(--tc);border-radius:7px;padding:1px 6px;font-size:calc(11px * var(--scala));font-weight:700}
.cg-nm{font-weight:700;font-size:calc(15px * var(--scala));margin-top:3px;overflow-wrap:anywhere}
.cg-nm i{font-style:normal;color:var(--tenue);font-weight:500;font-size:calc(12.5px * var(--scala))}
.cg-ti{font-weight:600;font-size:calc(14px * var(--scala));color:var(--testo2);margin-top:2px}
.cg-tx{font-size:calc(13.5px * var(--scala));color:var(--testo2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cg-rf{font-size:calc(12px * var(--scala));color:var(--tenue);margin-top:3px}
.t-azione{--tc:var(--verde)}
/* CRUSCOTTO */
.cr-nota{font-size:calc(13px * var(--scala));color:var(--tenue);margin:2px 0 12px;line-height:1.4}
.cr-k{min-height:76px}
.cr-k .et{font-size:calc(11.5px * var(--scala));color:var(--tenue);text-transform:uppercase;letter-spacing:.06em;line-height:1.25}
.cr-k .nm{font-size:calc(22px * var(--scala));font-weight:800;color:var(--c);line-height:1.2;margin-top:2px}
.cr-k .ds{font-size:calc(11.5px * var(--scala));color:var(--tenue);line-height:1.3}
/* TUTELE */
.tu-r{background:var(--carta);border:1px solid var(--bordo);border-left:5px solid var(--ambra);border-radius:12px;padding:10px 12px;box-shadow:var(--ombra)}
.tu-r:active{background:var(--hover)}
.tu-n{font-weight:700;font-size:calc(15px * var(--scala));overflow-wrap:anywhere}
.tu-n i{font-style:normal;color:var(--tenue);font-weight:500;font-size:calc(12.5px * var(--scala))}
.tu-p{margin-top:6px;border:1px solid color-mix(in srgb,var(--verde) 40%,var(--bordo));background:color-mix(in srgb,var(--verde) 12%,var(--carta));color:var(--verde);
  border-radius:9px;padding:4px 9px;font:inherit;font-weight:700;font-size:calc(12.5px * var(--scala))}
.tu-d{font-size:calc(12.5px * var(--scala));color:var(--tenue);margin-top:4px}
.tu-x{font-size:calc(13.5px * var(--scala));color:var(--testo2);margin-top:4px}
.altri{width:100%;padding:12px;background:var(--carta2);border:0;color:var(--accent);font-weight:600}
/* titoli di vista */
h1.tit{font-size:calc(13px * var(--scala));letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);font-weight:800;margin:14px 2px 8px}
h1.tit:first-child{margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:10px 12px;box-shadow:var(--ombra);border-left:5px solid var(--c,var(--accent))}
.kpi .et{font-size:calc(11.5px * var(--scala));color:var(--tenue);text-transform:uppercase;letter-spacing:.06em;font-weight:700}.kpi .nm{font-size:calc(26px * var(--scala));font-weight:800;line-height:1.1;color:var(--c,var(--testo))}
/* scheda */
#scheda{position:fixed;inset:0;z-index:3000;background:var(--sfondo);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .22s ease;padding:0 12px calc(30px + var(--sab))}
#scheda.on{transform:none}
.sc-top{position:sticky;top:0;z-index:5;background:var(--capo);margin:0 -12px 12px;padding:calc(8px + var(--sat)) 10px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.sc-top .ind{width:38px;height:38px;border:0;background:transparent;color:var(--accent);font-size:calc(22px * var(--scala));border-radius:10px}
.sc-top .tt{flex:1;min-width:0}.sc-top .tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:calc(17px * var(--scala));overflow:hidden;line-height:1.15}.sc-top .tt span{font-size:calc(12px * var(--scala));color:var(--tenue)}
.sz{border:1px solid var(--bordo);border-radius:14px;margin:0 0 12px;background:var(--carta);box-shadow:var(--ombra);overflow:hidden;border-left:6px solid var(--c)}
.sz>h3{margin:0;padding:9px 14px;border-bottom:1px solid var(--bordo);text-transform:uppercase;letter-spacing:.12em;font-size:calc(12px * var(--scala));font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--carta));display:flex;align-items:center;gap:6px}
.sz>h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c)}
.sz>h3.con-ico::before{content:none}
.sz>h3.con-ico{gap:8px}
.sz>h3.con-ico>.ki{width:23px;height:23px;border-radius:7px}
.sz>h3.con-ico>.ki svg{width:14px;height:14px}
.sz>h3 .pill{margin-left:auto;text-transform:none;letter-spacing:0}
@keyframes sz-pulsa{0%,100%{box-shadow:0 0 0 2px var(--c),0 0 0 0 color-mix(in srgb,var(--c) 40%,transparent)}50%{box-shadow:0 0 0 4px var(--c),0 0 24px 10px color-mix(in srgb,var(--c) 32%,transparent)}}
.sz.lampeggia{animation:sz-pulsa 1.15s ease-in-out infinite;border-color:var(--c);position:relative;z-index:3}
.sz.lampeggia>h3{background:color-mix(in srgb,var(--c) 22%,var(--carta));border-bottom:2px solid var(--c)}
@media (prefers-reduced-motion:reduce){.sz.lampeggia{animation:none;box-shadow:0 0 0 4px var(--c)}}
.sz>.c{padding:12px 14px}
.sz-clas{--c:var(--sz-clas)}.sz-rec{--c:var(--sz-rec)}.sz-ref{--c:var(--sz-ref)}.sz-dim{--c:var(--sz-dim)}.sz-prof{--c:var(--sz-prof)}.sz-sit{--c:var(--sz-sit)}.sz-prom{--c:var(--sz-prom)}.sz-file{--c:var(--sz-file)}.sz-cron{--c:var(--sz-cron)}.sz-prat{--c:var(--sz-prat)}

/* ============================================================
   DOVE STANNO I TASTI FLUTTUANTI NELLA PILA DEGLI STRATI
   Una riga per ogni situazione, tutte con lo stesso peso e in ordine di priorità:
   l'ultima che vale è quella che comanda. Così non può più succedere che una regola
   di una vista (la mappa) copra quella di una finestra che si apre sopra (la scheda).
     mappa aperta        → sopra alla mappa (1200) ma sotto ai suoi comandi
     scheda del cliente  → sopra alla scheda (3000)

   ============================================================ */

/* toccando una riga del calendario: un «report da fare» porta direttamente al modulo del report,
   l'attività in programma si corregge, l'evento già registrato apre la scheda del cliente */
function calApri(k, id, cid) {
  if (k === 'cron') { apriScheda(cid); return; }    /* già documentata: apro la scheda del cliente */
  var a = attArchivio()[id]; if (!a) return;
  if (a.fatto) { calRegistra(a); return; }           /* svolta: vado a scrivere il report */
  attForm({ id: id });                               /* ancora da fare: è un programma, si corregge */
}
/* l'attività diventa svolta e si apre il modulo del report, già compilato con quello che so */
function calRegistra(a) {
  var canale = { visita: 'Visita', telefonata: 'Telefono', mail: 'Email' }[a.tipo] || '';
  if (!a.fatto) { attSegnaFatta(a.id, true); if (vista === 'cal') disegnaCal(); }
  apriReportCliente(a.cid, { d: a.d, o: a.o || '', c: canale, t: a.nota || '' });
}
function apriReportCliente(cid, pre) {
  apriScheda(cid);
  setTimeout(function () {
    var d = $('#sc-nuovo'); if (!d) return;
    d.open = true;
    if (pre) ['d', 'o', 'c', 't'].forEach(function (k) { var e = $('#ev-' + k); if (e && pre[k]) e.value = pre[k]; });
    d.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var t = $('#ev-t'); if (t) setTimeout(function () { t.focus(); }, 350);
  }, 220);
}

/* cerca un cliente per nome dell'azienda oppure per persona di riferimento */
function attTrova(t) {
  t = String(t || '').trim().toLowerCase(); if (t.length < 2) return [];
  var L = lista(), out = [], visti = {};
  L.forEach(function (c) { if (out.length < 10 && c.nome.toLowerCase().indexOf(t) >= 0) { out.push({ c: c, via: '' }); visti[c.id] = 1; } });
  L.forEach(function (c) {
    if (out.length >= 10 || visti[c.id]) return;
    var r = referentiDi(c).filter(function (x) { return [x.nome, x.ruolo, x.email, x.tel, x.cell].join(' ').toLowerCase().indexOf(t) >= 0; })[0];
    if (r) { out.push({ c: c, via: 'referente: ' + r.nome + (r.ruolo ? ' · ' + r.ruolo : '') }); visti[c.id] = 1; return; }
    var rf = (sit(c.id).referente || '');
    if (rf.toLowerCase().indexOf(t) >= 0) { out.push({ c: c, via: 'referente: ' + rf }); visti[c.id] = 1; }
  });
  return out;
}

/* VICINO A ME */
var mappa = null, posMe = null, livelloPin = null;
function distKm(a, b, c, d) { var R = 6371, dLat = (c - a) * Math.PI / 180, dLng = (d - b) * Math.PI / 180, x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2); return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); }
function kmIt(k) { return k < 10 ? k.toLocaleString('it-IT', { maximumFractionDigits: 1 }) : Math.round(k).toLocaleString('it-IT'); }
function disegnaVicino() {

    navigator.geolocation.getCurrentPosition(function (p) { posMe = { lat: p.coords.latitude, lng: p.coords.longitude }; disegnaVicino(); }, function (e) { conta_.textContent = 'Posizione non concessa (' + e.message + '). Attiva la localizzazione per il browser.'; }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });

  conta_.textContent = num(L.length) + ' contatti entro ' + raggio + ' km' + (L.length > 200 ? ' (in elenco i 200 più vicini)' : '');
  box.innerHTML = ''; var frag = document.createDocumentFragment();
  L.slice(0, 200).forEach(function (x) { frag.appendChild(rigaContatto(x.c, '<span class="km">' + kmIt(x.km) + ' km</span>')); }); box.appendChild(frag);

  if (!L.length) box.innerHTML = '<div class="vuoto">Nessun contatto con coordinate entro ' + raggio + ' km.</div>';
  if (window.L) {
    if (!mappa) { mappa = window.L.map('mappa', { zoomControl: false }); window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(mappa); livelloPin = window.L.layerGroup().addTo(mappa); }
    livelloPin.clearLayers();

      m._cmId = c.id;
      m.bindPopup(function () { return popupPin(c).replace('</div></div>', '</div><div class="pop-km">' + kmIt(x.km) + ' km da qui</div></div>'); }, { maxWidth: 280, autoPanPaddingTopLeft: [10, 60], autoPanPaddingBottomRight: [10, 60] });
      m.off('click', m._openPopup, m); m.on('click', function () { if (!m.isPopupOpen()) m.openPopup(); });
      m.on('popupopen', function () { pinSel = c.id; aggiornaFab(); });
      m.on('popupclose', function () { if (pinSel === c.id) { pinSel = ''; aggiornaFab(); } });
    });
    var b = window.L.latLng(posMe.lat, posMe.lng).toBounds(Math.min(raggio, 50) * 1000); mappa.fitBounds(b);
    setTimeout(function () { mappa.invalidateSize(); }, 200);

  function chiudi() { f.remove(); document.body.classList.remove('me-aperto'); }

  f.innerHTML = '<div class="fg"><h4>' + (mail ? 'Modifica la voce' : 'Modifica il report') + '</h4>' +
    (mail ? '<div class="nota" style="margin-bottom:10px">Questa è una <b>mail archiviata</b>: il testo della mail resta com\'è arrivato. Qui correggi il titolo, la nota e la data.</div>' : '') +

  $('#me-del', f).addEventListener('click', function () {

    if (!confirm('Elimino «' + che + '» del ' + dataIt(v.d) + (v.o ? ' alle ' + v.o : '') + ' dalla cronologia?\n\nL\'operazione non si può annullare: la voce sparisce anche da GESTIONE CONTATTI sul Mac alla prossima sincronizzazione.')) return;

  f.classList.add('on');
  f.classList.toggle('sopra', document.body.classList.contains('sc-aperta'));
  var c = clienteContesto() ? DB.contatti[clienteContesto()] : null;
  f.title = c ? 'Aggiungi per ' + c.nome : 'Visita, telefonata o mail da programmare, oppure il report di una cosa già fatta';
  f.classList.toggle('mirato', !!c);
}
$('#fab').addEventListener('click', function () {
  if (this.dataset.spostato) return;
  attForm({ cid: clienteContesto(), d: (vista === 'cal' && CAL.sel) ? CAL.sel : oggi() });
});
$('#fab-ind').addEventListener('click', function () { if (this.dataset.spostato) return; tornaIndietro(); });
fabSpostabile($('#fab')); fabSpostabile($('#fab-ind'));
window.addEventListener('resize', function () { fabPosApplica($('#fab')); fabPosApplica($('#fab-ind')); });
/* ---------- avvio ---------- */
applicaTema(); applicaFs(); misuraTestata(); $('#versione').textContent = 'v' + APP_VER;
IDB.leggi('db').then(function (t) {
  if (t) { try { var j = JSON.parse(t); if (j && j.contatti) DB = Object.assign({ contatti: {}, situazioni: {}, eventi: {}, pratiche: {}, nuoviContatti: {}, modificheContatti: {}, config: {} }, j); } catch (e) {} }
  var v = 'cerca'; try { v = localStorage.getItem('cm.vista') || 'cerca'; } catch (e) {}
  if (v === 'vicino' || v === 'mappa') v = 'cerca';
  /* i tasti dei gruppi nascono prima della lettura dei dati: ora che il settaggio c'e', li ridisegno con nome e colore giusti */
  try { normalizzaGR(JSON.parse(localStorage.getItem('cm.gruppi') || 'null')); } catch (e) { normalizzaGR(null); }
  migraNessunaAzione();
  barraOrdineApplica();
  schedeApplica();
  disegnaGruppi();
  inRitorno = true; mostraVista(v); inRitorno = false;   /* riaprire l'app dov'era non è un passo */
  storiaCarica(); aggiornaInd();
  avviaSync(); setTimeout(function () { misuraTestata(); aggiornaFab(); aggiornaInd(); }, 300);
  $('#agg-ora').addEventListener('click', applicaAggiornamento);
  $('#agg-no').addEventListener('click', function () { barraAgg(false); });
  controllaAggiornamenti();
  setInterval(function () { if (!document.hidden) controllaAggiornamenti(); }, 1800000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) controllaAggiornamenti(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
});
window.CM = { get DB() { return DB; }, get SY() { return SY; }, get MP() { return MP; }, apriScheda: apriScheda, mostraVista: mostraVista };
})();
</script>
</body>
</html>
